aid: stackmint
name: Stackmint
description: >-
  Stackmint is a governed execution platform for enterprise AI workflows.
  Rather than deploying raw agents, the platform packages AI capabilities
  with built-in controls — budget circuit breakers, human approval gates,
  compliance routing, and ROI measurement — so organizations can move AI
  projects from research into production with auditable execution paths.
  The platform exposes a Semantic Execution Layer (SEL) of ontology,
  semantics, branches, agents, and runtime/audit, and offers a REST API
  for managing clients, branches (workflows), buds (atomic units), and
  MCP-compatible tool surfaces for LLM integration.
