- aid: stackmint:platform-api
  name: Stackmint Platform API
  description: >-
    REST API for managing Stackmint workflows. Provides endpoints for listing and retrieving clients (orgs),
    enumerating and running Branches (composable workflows) and Buds (atomic execution units), and exposing
    MCP-compatible tool surfaces that LLMs and agents can discover and invoke under governance and audit
    controls.
