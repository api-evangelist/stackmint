apis:
  - aid: stackmint:platform-api
    name: Stackmint Platform API
    description: >-
      REST API for managing Stackmint workflows. Provides endpoints for
      listing and retrieving clients (orgs), enumerating and running
      Branches (composable workflows) and Buds (atomic execution units),
      and exposing MCP-compatible tool surfaces that LLMs and agents can
      discover and invoke under governance and audit controls.
    humanURL: https://stackmint.ai/en/api-reference
    baseURL: https://api.stackmint.ai/v1
    tags:
      - Workflows
      - Branches
      - Buds
      - MCP
      - Governance
    properties:
      - type: Documentation
        url: https://stackmint.ai/en/api-reference
      - type: Developers
        url: https://stackmint.ai/en/developers
      - type: Authentication
        url: https://stackmint.ai/en/api-reference
        description: >-
          Bearer token scheme with org-level scoping. Requires
          Authorization: Bearer <api-key> and X-Stackmint-Org-Id: <orgId>
          headers; optional role/scope parameters for admin and MCP
          endpoints.
      - type: Semantic Standard
        url: https://stackmint.ai/en/semantic-standard
