naftiko: 1.0.0-alpha2
info:
  title: Stackmint Bud Run
  description: "Invoke a Stackmint Bud (atomic execution unit) as a sub-operation in a Naftiko\
    \ orchestration. Useful when an existing Bud encapsulates work that a Naftiko capability\
    \ should hand off to Stackmint rather than reimplement \u2014 Stackmint executes the Bud\
    \ with full audit and budget controls; Naftiko composes the result into a larger capability."
  tags:
  - Naftiko
  - Stackmint
  - Partnership
  - Execution
  - Bud
  created: '2026-05-21'
  modified: '2026-05-21'
binds:
- namespace: stackmint-env
  description: Stackmint Platform API bearer token and Org id header.
  keys:
    STACKMINT_TOKEN: STACKMINT_TOKEN
    STACKMINT_ORG_ID: STACKMINT_ORG_ID
capability:
  consumes:
  - namespace: stackmint
    type: http
    baseUri: https://api.stackmint.ai/v1
    authentication:
      type: bearer
      token: '{{STACKMINT_TOKEN}}'
    inputParameters:
    - name: X-Stackmint-Org-Id
      in: header
      value: '{{STACKMINT_ORG_ID}}'
    resources:
    - name: bud-run
      path: /clients/{{client_id}}/buds/{{bud_id}}/run
      operations:
      - name: run-bud
        method: POST
        inputParameters:
        - name: client_id
          in: path
          required: true
        - name: bud_id
          in: path
          required: true
        body: '{{input}}'
  exposes:
  - type: rest
    address: 0.0.0.0
    port: 8080
    namespace: stackmint-bud-run-rest
    description: REST surface for Stackmint Bud Run.
    resources:
    - name: run-bud
      path: /stackmint/clients/{client_id}/buds/{bud_id}/run
      operations:
      - name: run-bud
        method: POST
        inputParameters:
        - name: client_id
          in: path
          required: true
        - name: bud_id
          in: path
          required: true
        call: stackmint.run-bud
  - type: mcp
    address: 0.0.0.0
    port: 9090
    namespace: stackmint-bud-run-mcp
    transport: http
    description: MCP surface for Stackmint Bud Run (for AI agent use).
    tools:
    - name: run-bud
      description: "Invoke a Stackmint Bud. Stackmint applies its execution gates \u2014 caller\
        \ pays Stackmint compute, gets Stackmint audit."
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      inputParameters:
      - name: client_id
        type: string
        required: true
      - name: bud_id
        type: string
        required: true
      - name: input
        type: string
        required: true
        description: Raw JSON string with the Bud input payload.
      call: stackmint.run-bud
