naftiko: 1.0.0-alpha2
info:
  title: Stackmint Clients Discovery
  description: Read-only discovery of Stackmint clients (org-level scoping roots) into Naftiko
    Fleet. Lets a platform team see every Stackmint client a Naftiko-built capability could
    be authored against, alongside the rest of the API surface inventory in Backstage.
  tags:
  - Naftiko
  - Stackmint
  - Partnership
  - Discovery
  - Clients
  created: '2026-05-21'
  modified: '2026-05-21'
binds:
- namespace: stackmint-env
  description: Stackmint Platform API bearer token and Org id header.
  keys:
    STACKMINT_TOKEN: STACKMINT_TOKEN
    STACKMINT_ORG_ID: STACKMINT_ORG_ID
capability:
  consumes:
  - namespace: stackmint
    type: http
    baseUri: https://api.stackmint.ai/v1
    authentication:
      type: bearer
      token: '{{STACKMINT_TOKEN}}'
    resources:
    - name: clients
      path: /clients
      operations:
      - name: list-clients
        method: GET
        inputParameters:
        - name: limit
          in: query
          required: false
        - name: cursor
          in: query
          required: false
  - namespace: stackmint
    type: http
    baseUri: https://api.stackmint.ai/v1
    authentication:
      type: bearer
      token: '{{STACKMINT_TOKEN}}'
    resources:
    - name: client
      path: /clients/{{client_id}}
      operations:
      - name: get-client
        method: GET
        inputParameters:
        - name: client_id
          in: path
          required: true
  exposes:
  - type: rest
    address: 0.0.0.0
    port: 8080
    namespace: stackmint-clients-discovery-rest
    description: REST surface for Stackmint Clients Discovery.
    resources:
    - name: list-clients
      path: /stackmint/clients
      operations:
      - name: list-clients
        method: GET
        inputParameters:
        - name: limit
          in: query
          required: false
        - name: cursor
          in: query
          required: false
        call: stackmint.list-clients
    - name: get-client
      path: /stackmint/clients/{client_id}
      operations:
      - name: get-client
        method: GET
        inputParameters:
        - name: client_id
          in: path
          required: true
        call: stackmint.get-client
  - type: mcp
    address: 0.0.0.0
    port: 9090
    namespace: stackmint-clients-discovery-mcp
    transport: http
    description: MCP surface for Stackmint Clients Discovery (for AI agent use).
    tools:
    - name: list-clients
      description: List every Stackmint client (org) the bearer token can see.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      inputParameters:
      - name: limit
        type: integer
        required: false
      - name: cursor
        type: string
        required: false
      call: stackmint.list-clients
    - name: get-client
      description: Get a Stackmint client by id.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      inputParameters:
      - name: client_id
        type: string
        required: true
      call: stackmint.get-client
